[project]
name = "clase4"
version = "0.1.0"
description = "Clase 4 — Workflows agenticos (chaining, routing, parallel, evaluator-optimizer, orchestrator) sobre corpus de cómics y música latinoamericana, arquitectura SOLID."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "openai>=1.50.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "langgraph>=1.2.2",
    "grandalf>=0.8",
]

[dependency-groups]
dev = [
    "ruff>=0.6.9",
    "pytest>=8.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clase4"]
